name: Build Windows Desktop Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'desktop/package.json'
      - 'desktop/src-tauri/tauri.conf.json'
      - 'desktop/src-tauri/Cargo.toml'
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read desktop version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content 'desktop/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $npm = (Get-Content 'desktop/package.json' -Raw | ConvertFrom-Json).version
          $cargo = ((Select-String -Path 'desktop/src-tauri/Cargo.toml' -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value)
          # A mismatch would upload SHA256SUMS to the wrong (older) release and break its updater.
          if ($npm -ne $version -or $cargo -ne $version) { throw "Version mismatch: tauri.conf.json=$version package.json=$npm Cargo.toml=$cargo" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install

      - name: Test native updater discovery
        working-directory: desktop/src-tauri
        run: cargo test --lib

      - name: Verify packaged updater has no PowerShell dependency
        shell: pwsh
        run: |
          $files = @('desktop/src-tauri/src/lib.rs','desktop/src-tauri/src/main.rs','desktop/src/main.js')
          $matches = Select-String -Path $files -Pattern 'powershell\.exe|install-update\.ps1|Invoke-WebRequest|Start-Process' -CaseSensitive:$false
          if ($matches) {
            $matches | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber) $($_.Line)" }
            throw 'Desktop updater still contains a PowerShell/script dependency.'
          }
          Write-Host '[OK] Shipping updater path has no PowerShell dependency.'


      - name: Build and publish Tauri installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: 'Research Dictionary Desktop v__VERSION__'
          releaseBody: |
            Windows 桌面研究辭典 v__VERSION__。

            - 完整詞彙內容、動態分類與可收合篩選
            - v0.5.2：精簡上方工具列，增加詞彙閱讀空間
            - v0.5.2：改善桌面 Google 登入接力與錯誤提示
            - v0.5.5：桌面登入改用 Firebase Auth REST，繞過 Tauri WebView 的 credential 登入相容問題
            - v0.5.6：更新安裝流程完全移除 PowerShell，降低企業防毒 SONAR 誤判
            - v0.5.6：修正桌面登入在網站授權完成前就因 Firestore 權限回應而停止等待的問題
            - Google 登入後可新增、修改、刪除自己的詞彙
            - 每筆詞彙可選私人或共享
            - 字體大小、Light / Dark、自訂全域快捷鍵
            - 自動偵測 GitHub Release，新版可直接下載、驗證 SHA-256 並安裝
            - NSIS EXE：一般使用者建議安裝檔
            - MSI：Windows Installer 套件
            - Portable EXE：免安裝執行檔
            - Install-Research-Dictionary.cmd：一鍵下載、驗證、靜默安裝並啟動
          releaseDraft: false
          prerelease: false
          args: '--bundles nsis,msi'

      - name: Prepare portable executable and helper scripts
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path 'desktop/src-tauri/target/release' -Filter 'ResearchDictionary.exe' -File | Select-Object -First 1
          if (-not $exe) { throw 'ResearchDictionary.exe was not produced.' }
          New-Item -ItemType Directory -Force -Path 'release-extra' | Out-Null
          Copy-Item $exe.FullName 'release-extra/ResearchDictionary.exe'
          Copy-Item 'install/Install-Research-Dictionary.cmd' 'release-extra/Install-Research-Dictionary.cmd'
          Copy-Item 'install/Run-Portable.cmd' 'release-extra/Run-Portable.cmd'

      - name: Generate installer checksum
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path 'desktop/src-tauri/target/release/bundle/nsis' -Filter '*setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'NSIS setup executable was not found.' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLowerInvariant()
          $releaseSetupName = "Research.Dictionary_${{ steps.version.outputs.version }}_x64-setup.exe"
          "$hash  $releaseSetupName" | Out-File -FilePath 'release-extra/SHA256SUMS.txt' -Encoding ascii

      - name: Upload portable EXE and one-click scripts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.version.outputs.version }}
          name: Research Dictionary Desktop v${{ steps.version.outputs.version }}
          files: |
            release-extra/ResearchDictionary.exe
            release-extra/Install-Research-Dictionary.cmd
            release-extra/Run-Portable.cmd
            release-extra/SHA256SUMS.txt


      - name: Smoke test updater download and silent install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $expectedTag = "desktop-v$version"
          $headers = @{ 'User-Agent' = 'ResearchDictionaryUpdaterSmokeTest' }

          $release = $null
          for ($i = 0; $i -lt 18; $i++) {
            try {
              $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/jush-website/research-dictionary/releases/latest' -Headers $headers
              if ($release.tag_name -eq $expectedTag) { break }
            } catch {}
            $release = $null
            Start-Sleep -Seconds 5
          }
          if (-not $release) { throw "Latest release did not become $expectedTag in time." }
          if ($release.tag_name -ne $expectedTag) { throw "Updater discovery returned $($release.tag_name), expected $expectedTag." }

          $setup = $release.assets | Where-Object { $_.name -match '(?i)_x64-setup\.exe$' } | Select-Object -First 1
          $checksumAsset = $release.assets | Where-Object { $_.name -eq 'SHA256SUMS.txt' } | Select-Object -First 1
          if (-not $setup) { throw 'Updater smoke test could not find the NSIS setup EXE.' }
          if (-not $checksumAsset) { throw 'Updater smoke test could not find SHA256SUMS.txt.' }

          New-Item -ItemType Directory -Force -Path 'update-smoke' | Out-Null
          $setupPath = Join-Path $PWD 'update-smoke\ResearchDictionary-Setup.exe'
          $sumPath = Join-Path $PWD 'update-smoke\SHA256SUMS.txt'

          Invoke-WebRequest -Uri $setup.browser_download_url -Headers $headers -OutFile $setupPath
          Invoke-WebRequest -Uri $checksumAsset.browser_download_url -Headers $headers -OutFile $sumPath

          $line = Get-Content $sumPath | Where-Object { $_ -match [regex]::Escape($setup.name) } | Select-Object -First 1
          if (-not $line) { throw "Installer checksum entry for $($setup.name) was not found." }

          $expected = ($line.Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $setupPath).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Updater checksum mismatch. Expected $expected but got $actual." }

          # Install through the app's own native helper mode (same path users hit), not PowerShell.
          $helper = Join-Path $PWD 'update-smoke\ResearchDictionaryUpdater.exe'
          Copy-Item 'release-extra/ResearchDictionary.exe' $helper
          $notRunning = Join-Path $PWD 'update-smoke\ResearchDictionary.exe'
          $proc = Start-Process -FilePath $helper -ArgumentList @('--apply-update', "`"$setupPath`"", "`"$notRunning`"") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Native update helper returned exit code $($proc.ExitCode)." }

          $candidates = @(
            "$env:LOCALAPPDATA\Research Dictionary\ResearchDictionary.exe",
            "$env:LOCALAPPDATA\Programs\Research Dictionary\ResearchDictionary.exe"
          )
          $installed = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $installed) {
            $found = Get-ChildItem -Path $env:LOCALAPPDATA -Filter 'ResearchDictionary.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $installed = $found.FullName }
          }
          if (-not $installed) { throw 'Silent install finished but ResearchDictionary.exe was not found.' }

          $info = (Get-Item $installed).VersionInfo
          if (-not ("$($info.ProductVersion)" -like "$version*" -or "$($info.FileVersion)" -like "$version*")) {
            throw "Installed version is $($info.ProductVersion) / $($info.FileVersion), expected $version."
          }

          Start-Sleep -Seconds 5
          $running = Get-Process -Name 'ResearchDictionary' -ErrorAction SilentlyContinue
          if ($running) { Write-Host '[OK] Helper relaunched the installed app.'; $running | Stop-Process -Force }
          else { Write-Warning 'Installed app was not observed running after helper relaunch (runner may lack a desktop session).' }

          Write-Host "[OK] Updater smoke test passed."
          Write-Host "     Latest release: $($release.tag_name)"
          Write-Host "     Asset:          $($setup.name)"
          Write-Host "     SHA256:         $actual"
          Write-Host "     Installed:      $installed"
