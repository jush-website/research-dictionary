name: Test legacy v0.5.1 updater discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-v051-updater.yml'

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Run exact v0.5.1 update discovery logic
        shell: powershell
        run: |
          [Console]::OutputEncoding=[System.Text.Encoding]::UTF8
          $ErrorActionPreference='Stop'
          $headers=@{'User-Agent'='ResearchDictionaryDesktop'}
          $r=Invoke-RestMethod -Uri 'https://api.github.com/repos/jush-website/research-dictionary/releases/latest' -Headers $headers
          $version=($r.tag_name -replace '^desktop-v','')
          $asset=$r.assets | Where-Object { $_.name -match '(?i)_x64-setup\.exe$' } | Select-Object -First 1
          if(-not $asset) { throw '找不到 Windows x64 NSIS 安裝檔。' }
          $digest=''
          $checksum=$r.assets | Where-Object { $_.name -eq 'SHA256SUMS.txt' } | Select-Object -First 1
          if($checksum) {
            $text=(Invoke-WebRequest -Uri $checksum.browser_download_url -Headers $headers).Content
            $line=$text -split '\r?\n' | Where-Object { $_ -match [regex]::Escape($asset.name) } | Select-Object -First 1
            if($line) { $digest=($line.Trim() -split '\s+')[0].ToLowerInvariant() }
          }
          Write-Host "latest=$version"
          Write-Host "asset=$($asset.browser_download_url)"
          Write-Host "digest=$digest"
          if([string]::IsNullOrWhiteSpace($version) -or [string]::IsNullOrWhiteSpace($asset.browser_download_url) -or [string]::IsNullOrWhiteSpace($digest)) {
            throw 'v0.5.1 checker would reject this release.'
          }
          $current=[version]'0.5.1'
          $latest=[version]$version
          if($latest -le $current) { throw "v0.5.1 would not see an update: current=$current latest=$latest" }
          Write-Host '[OK] v0.5.1 should detect v0.5.3 as an update.'
